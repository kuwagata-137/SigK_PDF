<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SigK PDF</title>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#eff2f6;
  --text:#1c2430; --muted:#5f6b7a;
  --border:#dfe3e8; --border-strong:#c4cbd3;
  --primary:#2f6feb; --accent:#2f6feb;
  --canvas:#8b93a1; --page:#ffffff;
  --page-shadow:0 1px 3px rgba(16,24,40,.28), 0 8px 20px rgba(16,24,40,.22);
  --select:rgba(47,111,235,.14); --danger:#d64545;
  --shadow:0 2px 4px rgba(16,24,40,.06), 0 10px 24px rgba(16,24,40,.12);
  --shadow-item:0 2px 8px rgba(16,24,40,.12);
  --topbar-shadow:0 1px 0 var(--border), 0 4px 10px rgba(16,24,40,.06);
  --radius:10px;
  --tabbar-height:36px;
  --toolbar-height:44px;
  --rail-width:72px;
  --side-width:240px;
  --status-height:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI','Yu Gothic UI',Meiryo,system-ui,sans-serif;
  font-size:13px; -webkit-font-smoothing:antialiased;
}
</style>
</head>
<body>
<div id="app">
  <div id="boot">SigK PDF</div>
</div>
</body>
</html>
