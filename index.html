<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SigK PDF</title>
<link rel="stylesheet" href="renderer/shell.css">
<link rel="stylesheet" href="renderer/text-layer.css">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#eff2f6;
  --text:#1c2430; --muted:#5f6b7a;
  --border:#dfe3e8; --border-strong:#c4cbd3;
  --primary:#2f6feb; --accent:#2f6feb;
  --canvas:#8b93a1; --page:#ffffff;
  --page-shadow:0 1px 3px rgba(16,24,40,.28), 0 8px 20px rgba(16,24,40,.22);
  --select:rgba(47,111,235,.14); --danger:#d64545;
  --shadow:0 2px 4px rgba(16,24,40,.06), 0 10px 24px rgba(16,24,40,.12);
  --shadow-item:0 2px 8px rgba(16,24,40,.12);
  --topbar-shadow:0 1px 0 var(--border), 0 4px 10px rgba(16,24,40,.06);
  --radius:10px;
  --tabbar-height:36px;
  --toolbar-height:44px;
  --rail-width:72px;
  --side-width:240px;
  --status-height:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI','Yu Gothic UI',Meiryo,system-ui,sans-serif;
  font-size:13px; -webkit-font-smoothing:antialiased;
}
</style>
</head>
<body>
<div id="app">

  <div id="tabbar">
    <div class="tab-add" data-icon="plus" data-icon-size="14" data-icon-stroke="2" title="タブを追加" aria-disabled="true"></div>
  </div>

  <div id="toolbar">
    <div class="tb-btn" id="btn-open" title="PDF を開く (Ctrl+O)"><span data-icon="open"></span>開く</div>
    <div class="tb-btn" id="btn-save" title="上書き保存 (Ctrl+S)" aria-disabled="true"><span data-icon="save"></span>保存</div>
    <div class="tb-sep"></div>
    <div class="tb-btn icon" id="btn-undo" data-icon="undo" title="元に戻す (Ctrl+Z)" aria-disabled="true"></div>
    <div class="tb-btn icon" id="btn-redo" data-icon="redo" title="やり直し (Ctrl+Y)" aria-disabled="true"></div>
    <div class="tb-sep"></div>
    <div class="pager" id="pager" aria-disabled="true">
      <div class="step" id="page-prev" data-icon="chevronLeft" data-icon-size="15" data-icon-stroke="2" title="前のページ"></div>
      <div class="num"><input id="page-current" type="text" inputmode="numeric" size="3" aria-label="ページ番号"><span id="page-total">/ –</span></div>
      <div class="step" id="page-next" data-icon="chevronRight" data-icon-size="15" data-icon-stroke="2" title="次のページ"></div>
    </div>
    <div class="tb-sep"></div>
    <div class="zoom" id="zoom" aria-disabled="true">
      <div class="step" id="zoom-out" title="縮小 (Ctrl+−)">−</div>
      <div class="val" id="zoom-value">100%</div>
      <div class="step" id="zoom-in" title="拡大 (Ctrl+＋)">＋</div>
    </div>
    <div class="tb-btn" id="btn-fit-width" aria-disabled="true" title="幅に合わせる"><span data-icon="fitWidth"></span>幅</div>
    <div class="tb-btn" id="btn-fit-page" aria-disabled="true" title="全体を表示"><span data-icon="fitPage"></span>全体</div>
    <div class="spacer"></div>
    <div class="tb-btn icon" id="btn-find" data-icon="search" title="文書内を検索 (Ctrl+F)" aria-disabled="true"></div>
    <div class="tb-btn icon" id="btn-print" data-icon="print" title="印刷 (Ctrl+P)" aria-disabled="true"></div>
  </div>

  <div id="body">

    <div id="rail">
      <div class="rail-item" data-mode="view">
        <span data-icon="modeView" data-icon-size="21"></span>
        <span class="lbl">閲覧</span>
      </div>
      <div class="rail-item" data-mode="pages">
        <span data-icon="modePages" data-icon-size="21"></span>
        <span class="lbl">ページ</span>
      </div>
      <div class="rail-item" data-mode="annot">
        <span data-icon="modeAnnot" data-icon-size="21"></span>
        <span class="lbl">注釈</span>
      </div>
      <div class="rail-item" data-mode="tools">
        <span data-icon="modeTools" data-icon-size="21"></span>
        <span class="lbl">ツール</span>
      </div>
    </div>

    <div id="side">
      <div class="side-head">
        <span id="side-title">サムネイル</span>
        <span class="collapse" id="side-collapse" data-icon="chevronLeft" data-icon-size="14" data-icon-stroke="1.9" title="サイドパネルを閉じる"></span>
      </div>
      <!-- tabindex はプログラムから当てるためのもので、Tab 順には入れない。
           Ctrl+A を「サイドパネルにフォーカスがあるとき」に限るのに要る
           （spec-1-5 確定事項18）。 -->
      <div class="side-scroll" id="side-scroll" tabindex="-1">
        <div class="thumbs1" id="thumbs" hidden></div>
        <p class="empty" id="thumbs-empty">文書を開くと<br>ページの一覧が出ます</p>
      </div>
      <!-- ページモードの操作（spec-1-5 確定事項50・51）。div ではなく button に
           してある。div のままではフォーカスが当たらず、キーボードから押せない。
           抽出は extract.js、挿入は insert.js が中身を持つ。 -->
      <div class="side-actions" id="side-actions" hidden>
        <button type="button" class="act" id="act-rotate-left" aria-disabled="true"><span data-icon="rotateLeft" data-icon-size="14" data-icon-stroke="1.9"></span>左回転</button>
        <button type="button" class="act" id="act-rotate-right" aria-disabled="true"><span data-icon="rotateRight" data-icon-size="14" data-icon-stroke="1.9"></span>右回転</button>
        <button type="button" class="act" id="act-extract" aria-disabled="true"><span data-icon="extract" data-icon-size="14" data-icon-stroke="1.9"></span>抽出</button>
        <button type="button" class="act" id="act-insert" aria-disabled="true"><span data-icon="insert" data-icon-size="14" data-icon-stroke="1.9"></span>挿入</button>
        <button type="button" class="act danger wide" id="act-delete" aria-disabled="true"><span data-icon="trash" data-icon-size="14" data-icon-stroke="1.9"></span>削除</button>
      </div>
    </div>

    <div id="side-resizer"></div>

    <!-- 重ねるものは #view の「外」に置く。#view はスクロールする器であり、
         その中で position:absolute にすると中身と一緒に流れて画面外へ出る
         （spec-1-2 確定事項20）。 -->
    <div id="view-wrap">
      <div id="view">
        <div id="view-pages" hidden></div>
      </div>
      <div class="empty" id="view-empty">
        <p id="view-message">文書が開かれていません</p>
        <div id="view-recent" hidden></div>
      </div>
      <div id="view-banner" hidden></div>
      <div id="view-drop" hidden aria-hidden="true">
        <div class="drop-frame"><span data-icon="open" data-icon-size="22"></span>ここにドロップして開く</div>
      </div>

      <!-- 検索バー（spec-1-4 確定事項22〜24）。#view の中に置くと、
           スクロールした分だけ画面外へ流れていく。 -->
      <div id="find-bar" hidden>
        <span class="find-icon" data-icon="search" data-icon-size="14"></span>
        <input id="find-input" type="text" placeholder="文書内を検索" aria-label="文書内を検索" autocomplete="off" spellcheck="false">
        <span id="find-count" class="find-count"></span>
        <span class="find-sep"></span>
        <button type="button" class="find-btn find-case" id="find-case" aria-pressed="false" title="大文字と小文字を区別">Aa</button>
        <button type="button" class="find-btn" id="find-prev" data-icon="chevronUp" data-icon-size="15" data-icon-stroke="2" title="前へ (Shift+F3)"></button>
        <button type="button" class="find-btn" id="find-next" data-icon="chevronDown" data-icon-size="15" data-icon-stroke="2" title="次へ (F3)"></button>
        <span class="find-sep"></span>
        <button type="button" class="find-btn" id="find-close" data-icon="close" data-icon-size="14" data-icon-stroke="2" title="閉じる (Esc)"></button>
      </div>
    </div>
  </div>

  <div id="status">
    <span id="status-file" title="文書情報を表示 (Ctrl+I)">文書なし</span><span class="sep">│</span>
    <span id="status-pages">–</span><span class="sep">│</span>
    <span id="status-size">–</span>
    <!-- 未保存の印（spec-1-5 確定事項49）。区切りごと出し入れするので
         1つの要素にまとめてある。 -->
    <span id="status-dirty" hidden><span class="sep">│</span>変更あり</span>
    <span class="spacer"></span>
    <span class="version" id="status-version"></span>
  </div>

  <!-- 文書情報（spec-1-2 確定事項11）。ネイティブの messageBox では文字を
       選択・コピーできないため、アプリ内のモーダルで出す。 -->
  <dialog id="doc-info">
    <div class="dlg-head">
      <span>文書情報</span>
      <button type="button" class="dlg-x" id="doc-info-close" data-icon="close" data-icon-size="14" data-icon-stroke="2" title="閉じる"></button>
    </div>
    <dl id="doc-info-body"></dl>
  </dialog>

  <!-- 印刷（spec-1-4 確定事項34〜37）。文書情報と同じ作法・同じ意匠のモーダル
       にする。モーダルなので、準備している間の背後の操作は自然に塞がれる。 -->
  <dialog id="print-dialog">
    <div class="dlg-head">
      <span>印刷</span>
      <button type="button" class="dlg-x" id="print-close" data-icon="close" data-icon-size="14" data-icon-stroke="2" title="閉じる"></button>
    </div>
    <div class="dlg-body">
      <p class="dlg-label">印刷する範囲</p>
      <label class="print-choice"><input type="radio" name="print-mode" id="print-mode-all" checked>すべてのページ</label>
      <label class="print-choice"><input type="radio" name="print-mode" id="print-mode-current">現在のページ</label>
      <label class="print-choice"><input type="radio" name="print-mode" id="print-mode-custom">ページ指定</label>
      <input type="text" id="print-pages" class="print-pages" placeholder="例: 1-5, 8" aria-label="印刷するページ" autocomplete="off">
      <p class="print-error" id="print-error" hidden></p>
      <div class="print-progress" id="print-progress" hidden>
        <div class="print-bar"><div class="print-bar-fill" id="print-bar"></div></div>
        <span id="print-progress-text"></span>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="dlg-btn" id="print-cancel">閉じる</button>
      <button type="button" class="dlg-btn primary" id="print-run">印刷…</button>
    </div>
  </dialog>

  <!-- 未保存の確認（spec-1-5 確定事項57）。塊④ の時点では保存の手段が無いので
       2択にしてある。「保存」を含む3択は塊⑤ で完成させる。
       既定のフォーカスは安全側（キャンセル）に置く。 -->
  <dialog id="confirm-overwrite">
    <div class="dlg-head"><span>上書きしますか</span></div>
    <div class="dlg-body">
      <p class="dlg-text" id="confirm-overwrite-text">このファイルは、開いたあとで変更されています。</p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="dlg-btn" id="confirm-overwrite-cancel">取りやめ</button>
      <button type="button" class="dlg-btn danger" id="confirm-overwrite-ok">上書き</button>
    </div>
  </dialog>

  <!-- パスワード付き PDF の入力（spec-1-6 確定事項66〜69）。pdf.js の
       onPassword から呼ばれる。**覚えない**ので、閉じるたびに入力欄を空へ戻す。 -->
  <dialog id="password-prompt">
    <div class="dlg-head"><span>パスワードの入力</span></div>
    <div class="dlg-body">
      <p class="dlg-text" id="password-prompt-text">この PDF はパスワードで保護されています。</p>
      <input type="password" id="password-prompt-input" class="dlg-input" aria-label="パスワード" autocomplete="off" spellcheck="false">
      <p class="dlg-error" id="password-prompt-error" hidden>パスワードが違います。</p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="dlg-btn" id="password-prompt-cancel">キャンセル</button>
      <button type="button" class="dlg-btn primary" id="password-prompt-ok">開く</button>
    </div>
  </dialog>

  <!-- 抽出の確認（spec-1-6 確定事項48）。抽出は新規文書へ複製するので、
       しおり・入力欄・名前付きのリンク先が必ず消える。失うものを先に名指しする
       のがこのダイアログの役目である。元ファイルは変えないので、既定のフォーカスは
       「抽出」に置く。 -->
  <dialog id="confirm-extract">
    <div class="dlg-head"><span>ページを抽出しますか</span></div>
    <div class="dlg-body">
      <p class="dlg-text" id="confirm-extract-text">選択したページを別のファイルへ書き出します。</p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="dlg-btn" id="confirm-extract-cancel">キャンセル</button>
      <button type="button" class="dlg-btn primary" id="confirm-extract-ok">抽出</button>
    </div>
  </dialog>

  <dialog id="confirm-discard">
    <div class="dlg-head"><span>変更を保存しますか</span></div>
    <div class="dlg-body">
      <p class="dlg-text" id="confirm-discard-text">編集内容は保存されていません。閉じると失われます。</p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="dlg-btn" id="confirm-discard-cancel">キャンセル</button>
      <button type="button" class="dlg-btn danger" id="confirm-discard-discard">保存しない</button>
      <button type="button" class="dlg-btn primary" id="confirm-discard-save">保存</button>
    </div>
  </dialog>
</div>

<!-- 印刷用のコンテナ（確定事項28）。画面では隠れており、@media print の
     ときだけ #app と入れ替わって紙に出る。 -->
<div id="print-area" aria-hidden="true"></div>

<!-- pdf.js は ESM でしか配布されていない。module はここ1本に限る（spec-1-1 確定事項1）。
     module は defer 相当で、下の classic スクリプトより後・DOMContentLoaded より前に走る。 -->
<script type="module" src="renderer/pdfjs-bridge.mjs"></script>
<script src="assets/icons.js"></script>
<script src="renderer/log.js"></script>
<script src="renderer/shell.js"></script>
<script src="renderer/viewer-layout.js"></script>
<script src="renderer/page-plan.js"></script>
<script src="renderer/page-history.js"></script>
<script src="renderer/text-layer.js"></script>
<script src="renderer/page-render.js"></script>
<script src="renderer/view-banner.js"></script>
<script src="renderer/viewer.js"></script>
<script src="renderer/thumbnails.js"></script>
<script src="renderer/page-grid.js"></script>
<script src="renderer/page-edit.js"></script>
<script src="renderer/confirm-discard.js"></script>
<script src="renderer/confirm-overwrite.js"></script>
<script src="renderer/password-prompt.js"></script>
<script src="renderer/confirm-extract.js"></script>
<script src="renderer/save.js"></script>
<script src="renderer/extract.js"></script>
<script src="renderer/insert.js"></script>
<script src="renderer/find-text.js"></script>
<script src="renderer/find.js"></script>
<script src="renderer/find-bar.js"></script>
<script src="renderer/print.js"></script>
<script src="renderer/doc-info.js"></script>
<script src="renderer/tabs.js"></script>
<script src="renderer/recent-panel.js"></script>
<script src="renderer/file-drop.js"></script>
<script src="renderer/viewer-controls.js"></script>
<script src="renderer/app.js"></script>
</body>
</html>
