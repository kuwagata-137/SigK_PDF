<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SigK PDF</title>
<link rel="stylesheet" href="renderer/shell.css">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#eff2f6;
  --text:#1c2430; --muted:#5f6b7a;
  --border:#dfe3e8; --border-strong:#c4cbd3;
  --primary:#2f6feb; --accent:#2f6feb;
  --canvas:#8b93a1; --page:#ffffff;
  --page-shadow:0 1px 3px rgba(16,24,40,.28), 0 8px 20px rgba(16,24,40,.22);
  --select:rgba(47,111,235,.14); --danger:#d64545;
  --shadow:0 2px 4px rgba(16,24,40,.06), 0 10px 24px rgba(16,24,40,.12);
  --shadow-item:0 2px 8px rgba(16,24,40,.12);
  --topbar-shadow:0 1px 0 var(--border), 0 4px 10px rgba(16,24,40,.06);
  --radius:10px;
  --tabbar-height:36px;
  --toolbar-height:44px;
  --rail-width:72px;
  --side-width:240px;
  --status-height:26px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI','Yu Gothic UI',Meiryo,system-ui,sans-serif;
  font-size:13px; -webkit-font-smoothing:antialiased;
}
</style>
</head>
<body>
<div id="app">

  <div id="tabbar">
    <div class="tab-add" data-icon="plus" data-icon-size="14" data-icon-stroke="2" title="タブを追加" aria-disabled="true"></div>
  </div>

  <div id="toolbar">
    <div class="tb-btn" id="btn-open" title="PDF を開く (Ctrl+O)"><span data-icon="open"></span>開く</div>
    <div class="tb-btn" aria-disabled="true"><span data-icon="save"></span>保存</div>
    <div class="tb-sep"></div>
    <div class="pager" id="pager" aria-disabled="true">
      <div class="step" id="page-prev" data-icon="chevronLeft" data-icon-size="15" data-icon-stroke="2" title="前のページ"></div>
      <div class="num"><input id="page-current" type="text" inputmode="numeric" size="3" aria-label="ページ番号"><span id="page-total">/ –</span></div>
      <div class="step" id="page-next" data-icon="chevronRight" data-icon-size="15" data-icon-stroke="2" title="次のページ"></div>
    </div>
    <div class="tb-sep"></div>
    <div class="zoom" id="zoom" aria-disabled="true">
      <div class="step" id="zoom-out" title="縮小 (Ctrl+−)">−</div>
      <div class="val" id="zoom-value">100%</div>
      <div class="step" id="zoom-in" title="拡大 (Ctrl+＋)">＋</div>
    </div>
    <div class="tb-btn" id="btn-fit-width" aria-disabled="true" title="幅に合わせる"><span data-icon="fitWidth"></span>幅</div>
    <div class="tb-btn" id="btn-fit-page" aria-disabled="true" title="全体を表示"><span data-icon="fitPage"></span>全体</div>
    <div class="spacer"></div>
    <div class="tb-btn icon" data-icon="search" title="検索" aria-disabled="true"></div>
  </div>

  <div id="body">

    <div id="rail">
      <div class="rail-item" data-mode="view">
        <span data-icon="modeView" data-icon-size="21"></span>
        <span class="lbl">閲覧</span>
      </div>
      <div class="rail-item" data-mode="pages">
        <span data-icon="modePages" data-icon-size="21"></span>
        <span class="lbl">ページ</span>
      </div>
      <div class="rail-item" data-mode="annot">
        <span data-icon="modeAnnot" data-icon-size="21"></span>
        <span class="lbl">注釈</span>
      </div>
      <div class="rail-item" data-mode="tools">
        <span data-icon="modeTools" data-icon-size="21"></span>
        <span class="lbl">ツール</span>
      </div>
    </div>

    <div id="side">
      <div class="side-head">
        <span id="side-title">サムネイル</span>
        <span class="collapse" id="side-collapse" data-icon="chevronLeft" data-icon-size="14" data-icon-stroke="1.9" title="サイドパネルを閉じる"></span>
      </div>
      <div class="side-scroll" id="side-scroll">
        <p class="empty">文書を開くと<br>ページの一覧が出ます</p>
      </div>
      <div class="side-actions" id="side-actions" hidden>
        <div class="act" aria-disabled="true"><span data-icon="rotateLeft" data-icon-size="14" data-icon-stroke="1.9"></span>左回転</div>
        <div class="act" aria-disabled="true"><span data-icon="rotateRight" data-icon-size="14" data-icon-stroke="1.9"></span>右回転</div>
        <div class="act" aria-disabled="true"><span data-icon="extract" data-icon-size="14" data-icon-stroke="1.9"></span>抽出</div>
        <div class="act danger" aria-disabled="true"><span data-icon="trash" data-icon-size="14" data-icon-stroke="1.9"></span>削除</div>
      </div>
    </div>

    <div id="side-resizer"></div>

    <div id="view">
      <div id="view-pages" hidden></div>
      <p class="empty" id="view-empty">文書が開かれていません</p>
    </div>
  </div>

  <div id="status">
    <span id="status-file">文書なし</span><span class="sep">│</span>
    <span id="status-pages">–</span><span class="sep">│</span>
    <span id="status-size">–</span>
    <span class="spacer"></span>
    <span class="version" id="status-version"></span>
  </div>
</div>

<!-- pdf.js は ESM でしか配布されていない。module はここ1本に限る（spec-1-1 確定事項1）。
     module は defer 相当で、下の classic スクリプトより後・DOMContentLoaded より前に走る。 -->
<script type="module" src="renderer/pdfjs-bridge.mjs"></script>
<script src="assets/icons.js"></script>
<script src="renderer/log.js"></script>
<script src="renderer/shell.js"></script>
<script src="renderer/viewer-layout.js"></script>
<script src="renderer/viewer.js"></script>
<script src="renderer/viewer-controls.js"></script>
<script src="renderer/app.js"></script>
</body>
</html>
