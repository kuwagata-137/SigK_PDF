  <path d="M56 10 H168 L218 60 V230 a16 16 0 0 1 -16 16 H56 a16 16 0 0 1 -16 -16 V26 a16 16 0 0 1 16 -16 Z" fill="#fff" stroke="#9aa4b1" stroke-width="8"/>
